# goqbot 配置文件。每一项的详细说明见：
# https://huilongxiji.github.io/gd-goqbot-docs/guide/config
# 标 ★ 的是首次使用必须填写的项。

qq:
  app_id: "your_app_id"            # ★ QQ 开放平台的 AppID
  client_secret: "your_secret"     # ★ QQ 开放平台的 AppSecret
  token: "your_app_token"          # 机器人令牌，可不填
  uin: 0                           # 机器人的 QQ 号，use_uin 为 true 时作为 self_id
  use_uin: false                   # self_id 用 QQ 号（true）还是 AppID（false）
  sandbox: false                   # true=连接沙箱环境
  shard_count: 1                   # 分片总数
  shard_id: 0                      # 本进程的分片号，从 0 开始
  mention_mode: strip              # 「@机器人」怎么上报：strip 去掉 / at 转成 at 段（多框架推荐）/ raw 保留原文
  ip_reject_action: "stop"         # IP 不在白名单（错误码 11298）时：stop 停止连接 / retry 定时重试 / exit 退出
  ip_reject_retry_interval: 60     # retry 的重试间隔（秒）
  developer_openid: ""             # 机器人开发者（机器人账号的管理员）的 OpenID，可不填。开发者是群主或管理员的群，被动回复为 60 分钟、每条 50 次
  text_intent:                     # 要接收的事件，去掉行首的 # 即可打开
    - "ReadyHandler"                 # 连接就绪（必须保留）
    - "ErrorNotifyHandler"           # 连接错误（必须保留）
    - "GroupATMessageEventHandler"   # 群里 @ 机器人的消息
    - "GroupMessageEventHandler"     # 群里的全部消息（需要群主授权）
    - "C2CMessageEventHandler"       # 单聊消息
    # 可选：
    # - "InteractionHandler"           # 按钮点击（用按钮时必须打开）
    # - "C2CFriendEventHandler"        # 加好友、删好友
    # - "GroupAddRobotEventHandler"    # 机器人被拉进群
    # - "GroupDelRobotEventHandler"    # 机器人被移出群
    # - "GroupMemberEventHandler"      # 群成员进群、退群（需在开放平台开启群成员事件）
    # - "GroupJoinRequestEventHandler" # 用户申请加群（需机器人是群管理员）
    # - "GroupMsgRejectEventHandler"   # 群关闭了机器人主动发言
    # - "GroupMsgReceiveEventHandler"  # 群开启了机器人主动发言
    # - "C2CMsgRejectEventHandler"     # 用户关闭了主动消息推送（get_c2c_msg_state 依赖它）
    # - "C2CMsgReceiveEventHandler"    # 用户开启了主动消息推送（同上）

onebot:
  message_format: "array"          # 消息格式：array 消息段 / string 额外附带 CQ 码
  debug: false                     # true=日志里显示更多调试信息
  downtime_message: ""             # 所有框架都掉线时自动回复的文字，空=不回复
  servers:                         # ★ 框架的连接方式，可以写多条，每条的开关、口令、心跳都单独设置；也可以在 WebUI 的「连接」页管理（立即生效）
    - ws:                          # 正向 WS：框架连进来
        disabled: true             # 开关：true=关闭（示例默认关闭），false=开启
        address: 0.0.0.0:6700
        access-token: ""           # 连接口令，框架那边填同一个值；建议设置
        heartbeat-interval: 5000   # 心跳间隔（毫秒），负数=不发
        # allow-sensitive-plugins: true  # 允许调用插件的敏感能力（还需要设置 access-token）
    - ws-reverse:                  # 反向 WS：goqbot 主动连框架（这是 NoneBot2 的默认地址）
        disabled: true             # 开关：true=关闭（示例默认关闭），false=开启
        universal: ws://127.0.0.1:8080/onebot/v11/ws
        access-token: ""           # 连接口令，框架那边填同一个值；建议设置
        heartbeat-interval: 5000   # 心跳间隔（毫秒），负数=不发
        reconnect-interval: 3000   # 断线重连间隔（毫秒）
        # allow-sensitive-plugins: true  # 允许调用插件的敏感能力（还需要设置 access-token）

idmap:
  path: "idmap.db"                 # ID 对照表，重启后仍能撤回消息、查回用户
  # disabled: true                 # 只存在内存里，重启后丢失

log:
  enabled: true                    # 是否按天写日志文件
  path: "logs"                     # 日志目录

# 插件一般不用配置，放进插件目录就能用
# plugins:
#   path: "plugins"                # 插件目录
#   node: ""                       # 运行 JS / TS 插件的 Node，留空=自动查找
