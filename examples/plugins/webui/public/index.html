<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>goqbot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230E7C86'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='19' text-anchor='middle' fill='white'%3Eg%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <div class="login-brand"><span class="brand-mark" aria-hidden="true">g</span>goqbot</div>
      <p class="muted">输入 WebUI 口令登录。口令在 goqbot 第一次启动时的日志里，也保存在 <code>plugin-data/webui/config.json</code>。</p>
      <label class="field">
        <span>口令</span>
        <input id="login-token" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn primary wide" type="submit">登录</button>
    </form>
  </main>

  <main id="setpass" class="login" hidden>
    <form id="setpass-form" class="login-box" novalidate>
      <div class="login-brand"><span class="brand-mark" aria-hidden="true">g</span>设置登录口令</div>
      <p class="muted">现在用的是 goqbot 第一次启动时自动生成的口令。请设置一个你自己的口令，以后用它登录。</p>
      <label class="field">
        <span>新口令</span>
        <input id="setpass-new" type="password" autocomplete="new-password" spellcheck="false" maxlength="128" required>
      </label>
      <ul id="setpass-rules" class="pw-rules" aria-live="polite"></ul>
      <label class="field">
        <span>再输入一次</span>
        <input id="setpass-again" type="password" autocomplete="new-password" spellcheck="false" maxlength="128" required>
      </label>
      <label class="pw-show"><input id="setpass-show" type="checkbox"> 显示口令</label>
      <p id="setpass-error" class="form-error" role="alert"></p>
      <button class="btn primary wide" type="submit">保存新口令</button>
      <button id="setpass-logout" class="btn ghost wide" type="button">退出</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <nav id="rail" class="rail" aria-label="主导航"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <dialog id="dialog" class="dialog">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <form method="dialog"><button class="btn ghost small" type="submit">关闭</button></form>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box"><span class="spinner" aria-hidden="true"></span><p id="overlay-text">正在重启 goqbot…</p></div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
