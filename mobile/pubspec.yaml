name: goqbot_monitor
description: Telegram-style mobile monitor for goqbot via SSH
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.12.0
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  crypto: ^3.0.5
  convert: ^3.1.1
  intl: ^0.19.0
  pinenacl: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
